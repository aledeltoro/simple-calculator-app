name: Update coverage tables

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  update-coverage:
    name: Update coverage tables in READMEs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5

      - name: Set up Node
        uses: actions/setup-node@v4

      # --- Backend coverage ---
      - name: Install backend dependencies
        working-directory: ./backend
        run: go mod download

      - name: Collect backend coverage
        id: backend
        working-directory: ./backend
        run: |
          go test -coverprofile=coverage.out ./... >/dev/null 2>&1

          TABLE="| Package | Coverage |\n|---|---|\n"

          while IFS= read -r line; do
            COV=$(echo "$line" | grep -oE '[0-9]+\.[0-9]+%')
            PKG=$(echo "$line" | sed 's|.*github.com/aledeltoro/simple-calculator-app/||' | sed 's|\t.*||')
            TABLE="${TABLE}| \`${PKG}\` | ${COV} |\n"
          done < <(go test -cover ./... 2>&1 | grep "coverage:")

          TOTAL=$(grep -v "cmd/api/main.go" coverage.out | go tool cover -func=/dev/stdin 2>&1 | tail -1 | grep -oE '[0-9]+\.[0-9]+%')

          echo "table<<EOF" >> "$GITHUB_OUTPUT"
          printf "%b" "$TABLE" >> "$GITHUB_OUTPUT"
          echo "| **Total** | **${TOTAL}** |" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          rm -f coverage.out

      - name: Update backend README
        working-directory: ./backend
        run: |
          TMP=$(mktemp)
          awk -v table="${{ steps.backend.outputs.table }}" '
            /<!-- COVERAGE_START -->/ { print; print table; skip=1; next }
            /<!-- COVERAGE_END -->/ { skip=0 }
            !skip { print }
          ' README.md > "$TMP" && mv "$TMP" README.md

      # --- Frontend coverage ---
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Collect frontend coverage
        id: frontend
        working-directory: ./frontend
        run: |
          RAW=$(npx vitest run --coverage 2>/dev/null | sed -n '/^ % Coverage/,$p')
          HEADER=$(echo "$RAW" | grep "^File")
          ALL=$(echo "$RAW" | grep "^All files")

          STMTS=$(echo "$ALL" | awk -F'|' '{gsub(/^[ \t]+|[ \t]+$/, "", $3); print $3}')
          BRANCH=$(echo "$ALL" | awk -F'|' '{gsub(/^[ \t]+|[ \t]+$/, "", $4); print $4}')
          FUNCS=$(echo "$ALL" | awk -F'|' '{gsub(/^[ \t]+|[ \t]+$/, "", $5); print $5}')
          LINES=$(echo "$ALL" | awk -F'|' '{gsub(/^[ \t]+|[ \t]+$/, "", $6); print $6}')

          echo "header=${HEADER}" >> "$GITHUB_OUTPUT"
          echo "stmts=${STMTS}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "funcs=${FUNCS}" >> "$GITHUB_OUTPUT"
          echo "lines=${LINES}" >> "$GITHUB_OUTPUT"

      - name: Update frontend README
        working-directory: ./frontend
        run: |
          TMP=$(mktemp)
          awk -v stmts="${{ steps.frontend.outputs.stmts }}" \
              -v branch="${{ steps.frontend.outputs.branch }}" \
              -v funcs="${{ steps.frontend.outputs.funcs }}" \
              -v lines="${{ steps.frontend.outputs.lines }}" '
            /<!-- COVERAGE_START -->/ {
              print
              print "| Metric | Coverage |"
              print "|---|---|"
              print "| Statements | " stmts " |"
              print "| Branches | " branch " |"
              print "| Functions | " funcs " |"
              print "| Lines | " lines " |"
              skip=1; next
            }
            /<!-- COVERAGE_END -->/ { skip=0 }
            !skip { print }
          ' README.md > "$TMP" && mv "$TMP" README.md

      # --- Commit ---
      - name: Commit updated READMEs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/README.md frontend/README.md
          if git diff --cached --quiet; then
            echo "No coverage changes to commit."
          else
            git commit -m "ci: update coverage tables [skip ci]"
            git push
          fi

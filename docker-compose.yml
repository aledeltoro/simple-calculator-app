version: "3.8"

services:
  api:
    build:
      context: ./backend
      dockerfile: cmd/api/build/Dockerfile
    ports:
      - "3000:3000"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      - api
